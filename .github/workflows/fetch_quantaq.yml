name: Update QuantAQ Sensor Data

on:
  schedule:
    - cron: "*/15 * * * *"  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual triggering

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install requests pandas pytz

      - name: Run data fetching script
        run: python scripts/fetch_qaq_data.py
        env:
          QUANTAQ_API_KEY: ${{ secrets.QUANTAQ_API_KEY }}


      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          
          git add data/*.csv
          git commit -m "Automated QuantAQ data update at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || { echo "No changes"; exit 0; }
          
          pushed=0
          for i in {1..5}; do
            git fetch origin main
            git rebase --autostash origin/main   # do NOT ignore failures
            if git push origin HEAD:main; then pushed=1; break; fi
            sleep 5
          done
          
          test "$pushed" -eq 1


