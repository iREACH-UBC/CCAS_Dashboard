name: Build pollutant JSON

on:
  # Manual trigger
  workflow_dispatch: {}

  workflow_run:
    workflows: ["Update Calibrated Data"]
    types: [completed]

  # Automatic every 10 minutes (UTC)
  schedule:
    - cron: '*/10 * * * *'   # ← every 10 min

concurrency:
  group: build-pollutant-jsonS
  cancel-in-progress: true     # kill prior run if a new one starts

jobs:
  generate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Generate pollutant_data.json
        run: python scripts/generate_json.py

      - name: Commit and push artefact
        run: |
          set -e                               # stop on any unhandled error
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
      
          # 1️⃣  Stage the generated files
          git add pollutant_data.json sensor_metadata.csv || true
      
          # 2️⃣  Exit early if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
      
          # 3️⃣  Commit once
          git commit -m "Automated pollutant_data.json update ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
      
          # 4️⃣  Push, retrying up to 5× in case someone updated main meanwhile
          for i in {1..5}; do
            # Re‑sync with the latest main while keeping our commit on top
            git pull --rebase --autostash origin main || true
      
            # Only overwrite our own tip; fail if main advanced meanwhile
            if git push origin HEAD:main --force-with-lease; then
              echo "Push succeeded on attempt $i"
              break
            fi
      
            echo "Push failed on attempt $i – retrying in 5 s..."
            sleep 5
          done
