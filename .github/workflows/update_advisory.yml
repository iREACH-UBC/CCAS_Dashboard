name: Update AQ Advisories JSON

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (curl/SSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install minimal R packages
        env:
          RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"   # prevent renv autoload
        run: >
          Rscript -e 'pkgs <- c("mRpostman","stringr","jsonlite","lubridate","dplyr");
          inst <- rownames(installed.packages());
          need <- setdiff(pkgs, inst);
          if (length(need)) install.packages(need, repos="https://cloud.r-project.org")'

      - name: Run email scraper
        env:
          YAHOO_USER: ${{ secrets.YAHOO_USER }}
          YAHOO_PASS: ${{ secrets.YAHOO_PASS }}
          CCAS_SKIP_RENV: "1"                    # tell the script to skip renv::restore()
          RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE" # double-lock renv autoload
        run: Rscript scripts/email_scraper.R

      - name: Commit and push if AQAdvisories.json changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AQAdvisories.json
          git diff --cached --quiet && echo "No changes to commit." || {
            git commit -m "Update AQAdvisories.json";
            git pull --rebase origin main;
            git push origin HEAD:main;
          }
