name: Update HelloLamppost JSON


on:
  schedule:
    - cron: "*/15 * * * *"  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual triggering

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pandas
        run: pip install pandas

      - name: Run update script
        run: python scripts/hellolamppost_integration.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure you're on a branch (Actions checkouts can be detached)
          git switch main 2>/dev/null || git checkout -B main
          
          git add HelloLamppostData.json
          
          git commit -m "Update HelloLamppostData"
          
          pushed=0
          for i in {1..10}; do
            git fetch origin main
            git rebase --autostash origin/main   # do not ignore failures
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 5
          done
          
          test "$pushed" -eq 1

