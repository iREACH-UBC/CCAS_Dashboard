name: Mirror or Regenerate pollutant_data.json

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:        # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out THIS repo (contains generate_json.py + supporting files) ──
      - name: Checkout this repo
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pytz requests

      # ── 3. Fetch the source JSON and decide what to do ───────────────────────
      - name: Check source JSON freshness
        id: freshness
        env:
          SOURCE_JSON_URL: "${{ vars.SOURCE_JSON_URL }}"
        run: |
          python - <<'EOF'
          import json, sys, os
          from datetime import datetime, timezone
          import urllib.request

          url = os.environ["SOURCE_JSON_URL"]
          print(f"Fetching {url} ...")

          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  data = json.load(r)
          except Exception as e:
              print(f"[WARN] Could not fetch source JSON: {e} → will regenerate")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("stale=true\n")
              sys.exit(0)

          generated_at_str = data.get("generated_at")
          if not generated_at_str:
              print("[WARN] No 'generated_at' field found → will regenerate")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("stale=true\n")
              sys.exit(0)

          try:
              generated_at = datetime.fromisoformat(generated_at_str)
          except ValueError:
              print(f"[WARN] Unparseable timestamp '{generated_at_str}' → will regenerate")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("stale=true\n")
              sys.exit(0)

          if generated_at.tzinfo is None:
              generated_at = generated_at.replace(tzinfo=timezone.utc)

          now = datetime.now(timezone.utc)
          age_minutes = (now - generated_at).total_seconds() / 60
          print(f"generated_at = {generated_at_str}")
          print(f"Age: {age_minutes:.1f} minutes")

          # Always save what we fetched (used on the fresh path, or as fallback)
          with open("pollutant_data.json", "w") as f:
              json.dump(data, f, indent=2)

          stale = "true" if age_minutes > 60 else "false"
          print(f"→ {'STALE: will regenerate' if stale == 'true' else 'FRESH: will copy as-is'}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"stale={stale}\n")
          EOF

      # ── 4a. FRESH PATH: pollutant_data.json already written above ────────────
      - name: "[Fresh] Confirm JSON copied"
        if: steps.freshness.outputs.stale == 'false'
        run: echo "Source JSON is fresh — using as-is, skipping regeneration."

      # ── 4b. STALE PATH: pull calibrated_data and regenerate ──────────────────
      - name: "[Stale] Checkout source data repo"
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_DATA_REPO }}   # e.g. "owner/sensor-data-repo"
          # If SOURCE_DATA_REPO is public, you can delete the token line below.
          # If it is private, add SOURCE_PAT to your repo secrets.
          token: ${{ secrets.SOURCE_PAT || github.token }}
          path: source_data

      - name: "[Stale] Copy data files into place"
        if: steps.freshness.outputs.stale == 'true'
        run: |
          cp -r source_data/calibrated_data ./calibrated_data
          [ -f source_data/sensor_metadata.csv ] && cp source_data/sensor_metadata.csv . || true
          [ -f source_data/AQAdvisories.json ]   && cp source_data/AQAdvisories.json .   || true

      - name: "[Stale] Run generate_json.py"
        if: steps.freshness.outputs.stale == 'true'
        run: python generate_json.py

      # ── 5. Push pollutant_data.json to the destination repo via GitHub API ───
      - name: Push JSON to destination repo
        env:
          DEST_PAT:  ${{ secrets.DEST_PAT }}
          DEST_REPO: ${{ vars.DEST_REPO }}   # e.g. "owner/dashboard-repo"
          DEST_FILE: ${{ vars.DEST_FILE }}   # path inside dest repo, e.g. "data/pollutant_data.json"
        run: |
          python - <<'EOF'
          import base64, json, os, urllib.request

          token    = os.environ["DEST_PAT"]
          repo     = os.environ["DEST_REPO"]
          filepath = os.environ.get("DEST_FILE", "pollutant_data.json")
          api_url  = f"https://api.github.com/repos/{repo}/contents/{filepath}"

          headers = {
              "Authorization":        f"Bearer {token}",
              "Accept":               "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type":         "application/json",
          }

          with open("pollutant_data.json", "rb") as f:
              content_b64 = base64.b64encode(f.read()).decode()

          # Get the current file's SHA (required by GitHub API to update existing files)
          sha = None
          try:
              req = urllib.request.Request(api_url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  sha = json.load(r).get("sha")
              print(f"Existing file found (sha={sha[:7]}…), will update.")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("File does not exist yet — will create.")
              else:
                  raise

          payload = {
              "message": "chore: update pollutant_data.json [auto]",
              "content": content_b64,
          }
          if sha:
              payload["sha"] = sha

          data = json.dumps(payload).encode()
          req  = urllib.request.Request(api_url, data=data, headers=headers, method="PUT")
          with urllib.request.urlopen(req) as r:
              resp = json.load(r)

          print(f"[SUCCESS] → {resp['content']['html_url']}")
          EOF
