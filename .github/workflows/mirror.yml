name: Mirror or Regenerate pollutant_data.json

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:        # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out THIS repo ────────────────────────────────────────────────
      - name: Checkout this repo
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pytz requests

      # ── 3. Fetch the source JSON and decide what to do ───────────────────────
      - name: Check source JSON freshness
        id: freshness
        env:
          SOURCE_JSON_URL: "${{ vars.SOURCE_JSON_URL }}"
        run: |
          python - <<'EOF'
          import json, sys, os
          from datetime import datetime, timezone
          import urllib.request

          url = os.environ["SOURCE_JSON_URL"]
          print(f"Fetching {url} ...")

          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  data = json.load(r)
          except Exception as e:
              print(f"[WARN] Could not fetch source JSON: {e} → will regenerate")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("stale=true\n")
              sys.exit(0)

          generated_at_str = data.get("generated_at")
          if not generated_at_str:
              print("[WARN] No 'generated_at' field found → will regenerate")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("stale=true\n")
              sys.exit(0)

          try:
              generated_at = datetime.fromisoformat(generated_at_str)
          except ValueError:
              print(f"[WARN] Unparseable timestamp '{generated_at_str}' → will regenerate")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("stale=true\n")
              sys.exit(0)

          if generated_at.tzinfo is None:
              generated_at = generated_at.replace(tzinfo=timezone.utc)

          now = datetime.now(timezone.utc)
          age_minutes = (now - generated_at).total_seconds() / 60
          print(f"generated_at = {generated_at_str}")
          print(f"Age: {age_minutes:.1f} minutes")

          # Always save what we fetched
          with open("pollutant_data.json", "w") as f:
              json.dump(data, f, indent=2)

          stale = "true" if age_minutes > 60 else "false"
          print(f"-> {'STALE: will regenerate' if stale == 'true' else 'FRESH: will copy as-is'}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"stale={stale}\n")
          EOF

      # ── 4a. FRESH PATH ────────────────────────────────────────────────────────
      - name: "[Fresh] Confirm JSON copied"
        if: steps.freshness.outputs.stale == 'false'
        run: echo "Source JSON is fresh — using as-is, skipping regeneration."

      # ── 4b. STALE PATH: pull calibrated_data and regenerate ──────────────────
      - name: "[Stale] Checkout source data repo"
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_DATA_REPO }}
          token: ${{ secrets.SOURCE_PAT || github.token }}
          path: source_data

      - name: "[Stale] Copy data files into place"
        if: steps.freshness.outputs.stale == 'true'
        run: |
          cp -r source_data/calibrated_data ./calibrated_data
          [ -f source_data/sensor_metadata.csv ] && cp source_data/sensor_metadata.csv . || true
          [ -f source_data/AQAdvisories.json ]   && cp source_data/AQAdvisories.json .   || true

      - name: "[Stale] Run generate_json.py"
        if: steps.freshness.outputs.stale == 'true'
        run: python generate_json.py

      # ── 5. Commit pollutant_data.json back to this repo ──────────────────────
      - name: Commit and push pollutant_data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pollutant_data.json
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "chore: update pollutant_data.json [auto]"
          git push
          
          for i in {1..5}; do
            # Re‑sync with the latest main while keeping our commit on top
            git pull --rebase --autostash origin main || true
      
            # Only overwrite our own tip; fail if main advanced meanwhile
            if git push origin HEAD:main --force-with-lease; then
              echo "Push succeeded on attempt $i"
              break
            fi
      
            echo "Push failed on attempt $i – retrying in 5 s..."
            sleep 5
          done
