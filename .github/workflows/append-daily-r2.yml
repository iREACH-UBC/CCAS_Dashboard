# .github/workflows/append-daily-r2.yml
name: Append daily calibrated rows to monthly R2 CSVs (R)

on:
  schedule:
    - cron: '15 7 * * *'  # 00:15 PT when UTC-7 (DST)
    - cron: '15 8 * * *'  # 00:15 PT when UTC-8 (standard)
  workflow_dispatch:
    inputs:
      sensors:
        description: 'Comma-separated sensor IDs (e.g., 2021,2022,2040)'
        required: false
      focus_date:
        description: 'Override focus date (YYYY_MM_DD). If empty, uses yesterday in America/Vancouver.'
        required: false

jobs:
  append:
    runs-on: ubuntu-latest
    env:
      # Disable renv autoloader to avoid it hijacking installs
      RENV_CONFIG_AUTOLOADER_ENABLED: 'FALSE'
      # Default sensors for scheduled runs (edit this)
      SENSORS: '2021,2022,2032,2040,2042,2043'
      # R2 creds
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET:   ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Guard: only run at 00:15 America/Vancouver"
        shell: bash
        run: |
          NOW_HM=$(TZ=America/Vancouver date +%H%M)
          if [[ "$NOW_HM" != "0015" ]]; then
            echo "Local time is not 00:15 PT (it's $NOW_HM). Exiting."
            exit 0
          fi
          echo "It's 00:15 PT. Proceeding."

      # NEW: install system packages needed for R source builds
      - name: Install system dependencies (libcurl, SSL, XML, X11, pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libx11-dev \
            pandoc \
            pkg-config

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("paws.storage","readr","dplyr","lubridate","stringr","purrr"), repos="https://cloud.r-project.org")'

      - name: Compute focus date and sensors
        id: vars
        shell: bash
        run: |
          SENS_RUN="${{ github.event.inputs.sensors }}"
          if [[ -z "$SENS_RUN" ]]; then SENS_RUN="${SENSORS}"; fi
          echo "sensors=$SENS_RUN" >> "$GITHUB_OUTPUT"

          FD_IN="${{ github.event.inputs.focus_date }}"
          if [[ -z "$FD_IN" ]]; then
            FOCUS=$(TZ=America/Vancouver date -d "yesterday" +%Y_%m_%d)
          else
            FOCUS="$FD_IN"
          fi
          echo "focus=$FOCUS" >> "$GITHUB_OUTPUT"
          echo "Using sensors: $SENS_RUN"
          echo "Using focus date: $FOCUS"

      - name: Run append script
        shell: bash
        run: |
          Rscript scripts/append_daily_r2.R \
            --sensors "${{ steps.vars.outputs.sensors }}" \
            --key-template "cc/data/{sensor}/{yyyymm}.csv" \
            --focus-date "${{ steps.vars.outputs.focus }}" \
            --sort-by DATE
